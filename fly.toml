# Fly.io alternative:  fly launch --no-deploy --copy-config  →  fly volumes create halhala_data --size 1  →  fly secrets set ADMIN_EMAILS=... PUBLIC_URL=...  →  fly deploy
app = "halhala"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "3000"

[mounts]
  source = "halhala_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/api/config"
    interval = "30s"
    timeout = "5s"
